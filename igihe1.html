<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IGIHE Layout Clone</title>
    <link rel="stylesheet" href="igihe1.css">
</head>
<body>

    <div class="top-strip"></div>

    <header class="header">

        <div class="logo"></div>

        <nav class="navbar">
            <ul>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
                <li></li>
            </ul>
        </nav>

        <div class="header-icons">
            <span></span>
            <span></span>
        </div>

    </header>

    <main>

        <section class="hero-news">

            <div class="featured-news">

                <div class="featured-image"></div>

                <div class="featured-content">
                    <div class="title big"></div>
                    <div class="title"></div>
                    <div class="title small"></div>

                    <div class="meta">
                        <span></span>
                        <span></span>
                    </div>
                </div>

            </div>

            <aside class="trending-news">

                <div class="trend-card">
                    <div class="trend-image"></div>

                    <div class="trend-text">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="trend-card">
                    <div class="trend-image"></div>

                    <div class="trend-text">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="trend-card">
                    <div class="trend-image"></div>

                    <div class="trend-text">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

            </aside>

        </section>

        <section class="categories">

            <div class="section-title"></div>

            <div class="category-grid">

                <div class="news-card">
                    <div class="card-image"></div>

                    <div class="card-content">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="news-card">
                    <div class="card-image"></div>

                    <div class="card-content">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="news-card">
                    <div class="card-image"></div>

                    <div class="card-content">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

                <div class="news-card">
                    <div class="card-image"></div>

                    <div class="card-content">
                        <div class="line"></div>
                        <div class="line small"></div>
                    </div>
                </div>

            </div>

        </section>

        <section class="featured-banner"></section>

        <section class="latest-news">

            <div class="section-title"></div>

            <div class="latest-grid">

                <div class="latest-card"></div>
                <div class="latest-card"></div>
                <div class="latest-card"></div>
                <div class="latest-card"></div>
                <div class="latest-card"></div>
                <div class="latest-card"></div>

            </div>

        </section>

    </main>

    <footer>

        <div class="footer-grid">
            <div></div>
            <div></div>
            <div></div>
            <div></div>
        </div>

        <div class="footer-bottom"></div>

    </footer>

</body>
</html>
